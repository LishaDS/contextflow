cat > frontend/context.html <<'EOF'
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ContextFlow - Context Analyzer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            min-height: 180px;
            padding: 15px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            resize: vertical;
        }

        button {
            margin-top: 15px;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            opacity: 0.85;
        }

        .results {
            margin-top: 30px;
        }

        .card {
            background: white;
            padding: 18px;
            margin-bottom: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .task-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .task-id {
            color: #777;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .success {
            color: green;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .error {
            color: #b00020;
            font-weight: bold;
        }

        a {
            display: inline-block;
            margin-top: 8px;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>ContextFlow</h1>

    <div class="subtitle">
        Turn scattered context into actionable tasks
    </div>

    <h2>Context Analyzer</h2>

    <textarea
        id="contextInput"
        placeholder="Paste your context here..."></textarea>

    <br>

    <button onclick="analyzeContext()">
        Analyze Context
    </button>

    <div id="results" class="results"></div>

</div>

<script>

async function analyzeContext() {

    const context = document.getElementById("contextInput").value.trim();
    const results = document.getElementById("results");

    if (!context) {
        results.innerHTML =
            '<div class="error">Please enter some context first.</div>';
        return;
    }

    results.innerHTML = "Analyzing context...";

    try {

        const response = await fetch("/analyze-context", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                context: context
            })
        });

        const data = await response.json();

        if (!response.ok) {
            results.innerHTML =
                `<div class="error">${data.detail || "Analysis failed."}</div>`;
            return;
        }

        const tasks = data.created_tasks || [];

        if (tasks.length === 0) {
            results.innerHTML =
                '<div class="card">No new tasks were created.</div>';
            return;
        }

        let html = `
            <div class="success">
                ✅ Context analyzed successfully
            </div>
        `;

        tasks.forEach(task => {

            html += `
                <div class="card">

                    <div class="task-title">
                        ${task.title || "Untitled task"}
                    </div>

                    <div class="task-id">
                        Task ID: ${task.task_id || "Not available"}
                    </div>

                    <div>
                        <strong>Deadline:</strong>
                        ${task.deadline || "Not specified"}
                    </div>

                    <div>
                        <strong>Priority:</strong>
                        ${task.priority || "Not specified"}
                    </div>

                    <div>
                        <strong>Status:</strong>
                        ${task.status || "Not specified"}
                    </div>

                    <div>
                        <strong>Dependency:</strong>
                        ${task.depends_on || "None"}
                    </div>

                    ${
                        task.link
                        ? `<a href="${task.link}" target="_blank">
                            🔗 Open Source
                           </a>`
                        : ""
                    }

                </div>
            `;
        });

        results.innerHTML = html;

    } catch (error) {

        console.error(error);

        results.innerHTML =
            '<div class="error">Could not connect to ContextFlow backend.</div>';
    }
}

</script>

</body>
</html>
