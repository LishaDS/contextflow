<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ContextFlow Dashboard</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 30px;
}

.container {
    max-width: 1100px;
    margin: auto;
}

h1 {
    margin-bottom: 5px;
}

.subtitle {
    color: #666;
    margin-bottom: 25px;
}

.summary {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 15px;
    margin-bottom: 30px;
}

.summary-card {
    background: white;
    padding: 18px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.summary-card .label {
    color: #666;
    font-size: 14px;
}

.summary-card .number {
    font-size: 28px;
    font-weight: bold;
    margin-top: 8px;
}

.task-card {
    background: white;
    padding: 20px;
    margin-bottom: 15px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.task-title {
    font-size: 19px;
    font-weight: bold;
    margin-bottom: 8px;
}

.task-id {
    font-size: 12px;
    color: #777;
    margin-bottom: 12px;
}

.detail {
    margin: 7px 0;
}

button {
    padding: 9px 14px;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    margin-top: 10px;
    background: #222;
    color: white;
}

.source-link {
    display: inline-block;
    margin-left: 8px;
    padding: 9px 14px;
    background: #e9eef5;
    color: #222;
    text-decoration: none;
    border-radius: 7px;
}

.empty {
    color: #777;
}

.error {
    color: #b00020;
    font-weight: bold;
}

@media (max-width: 800px) {
    .summary {
        grid-template-columns: repeat(2, 1fr);
    }
}
</style>
</head>

<body>

<div class="container">

<h1>ContextFlow</h1>

<div class="subtitle">
AI-powered Context-to-Workflow Automation
</div>

<div class="summary">

    <div class="summary-card">
        <div class="label">Total Tasks</div>
        <div class="number" id="totalTasks">0</div>
    </div>

    <div class="summary-card">
        <div class="label">Completed</div>
        <div class="number" id="completedTasks">0</div>
    </div>

    <div class="summary-card">
        <div class="label">Pending</div>
        <div class="number" id="pendingTasks">0</div>
    </div>

    <div class="summary-card">
        <div class="label">High Priority</div>
        <div class="number" id="highTasks">0</div>
    </div>

    <div class="summary-card">
        <div class="label">Upcoming Deadlines</div>
        <div class="number" id="upcomingTasks">0</div>
    </div>

</div>

<div style="margin-bottom:20px;">

    <button onclick="filterTasks('ALL')">
        All
    </button>

    <button onclick="filterTasks('PENDING')" style="margin-left:8px;">
        Pending
    </button>

    <button onclick="filterTasks('COMPLETED')" style="margin-left:8px;">
        Completed
    </button>

    <button onclick="filterTasks('HIGH')" style="margin-left:8px;">
        High Priority
    </button>
    <input id="taskSearch" type="text" placeholder="Search tasks..." oninput="searchTasks()" style="margin-left:8px; padding:8px;">

</div>

<h2>Tasks</h2>

<div id="tasks">
Loading tasks...
</div>

</div>

<script>

let allTasks = [];

function searchTasks() {
    const query = document.getElementById("taskSearch").value.toLowerCase().trim();

    const filtered = allTasks.filter(task =>
        task.title.toLowerCase().includes(query) ||
        (task.category || "").toLowerCase().includes(query) ||
        (task.priority || "").toLowerCase().includes(query) ||
        (task.status || "").toLowerCase().includes(query)
    );

    renderTasks(filtered);
}


function filterTasks(filter) {

    let filtered = allTasks;

    if (filter === "PENDING") {

        filtered = allTasks.filter(
            task => task.status !== "COMPLETED"
        );

    }

    if (filter === "COMPLETED") {

        filtered = allTasks.filter(
            task => task.status === "COMPLETED"
        );

    }

    if (filter === "HIGH") {

        filtered = allTasks.filter(
            task =>
                task.priority &&
                task.priority.toLowerCase() === "high"
        );

    }

    renderTasks(filtered);
}


function renderTasks(tasks) {

    const container = document.getElementById("tasks");

    container.innerHTML = "";

    tasks.forEach(task => {

        const card = document.createElement("div");

        card.className = "task-card";

        card.innerHTML = `

            <div class="task-title">
                ${task.title}
            </div>

            <div class="task-id">
                Task ID: ${task.task_id}
            </div>

            <div class="detail">
                <strong>Description:</strong>
                ${task.description || "Not specified"}
            </div>

            <div class="detail">
                <strong>Deadline:</strong>
                ${task.deadline || "Not specified"}
            </div>

            <div class="detail">
                <strong>Priority:</strong>
                ${task.priority}
            </div>

            <div class="detail">
                <strong>Category:</strong>
                ${task.category || "general"}
            </div>

            <div class="detail">
                <strong>AI Confidence:</strong>
                ${task.confidence != null
                    ? Math.round(task.confidence * 100) + "%"
                    : "Not available"}
            </div>

            <div class="detail">
                <strong>Status:</strong>
                ${task.status}
            </div>

            <div class="detail">
                <strong>Dependency:</strong>
                ${task.depends_on || "None"}
            </div>

        `;

        container.appendChild(card);

    });
}


async function loadTasks() {

    const container = document.getElementById("tasks");

    try {

        const response = await fetch("/tasks");

        if (!response.ok) {

            throw new Error("Failed to load tasks");

        }

        const tasks = await response.json();

        allTasks = tasks;

        updateSummary(tasks);

        if (!tasks || tasks.length === 0) {

            container.innerHTML =
                '<div class="empty">No tasks found.</div>';

            return;

        }

        container.innerHTML = "";

        tasks.forEach(task => {

            const card = document.createElement("div");

            card.className = "task-card";

            const deadline =
                task.deadline || "Not specified";

            const dependency =
                task.depends_on || "None";

            let deadlineStatus = "No deadline";

            if (task.deadline) {
                const today = new Date();
                const due = new Date(task.deadline + "T23:59:59");
                const daysLeft = Math.ceil((due - today) / 86400000);

                if (task.status === "COMPLETED") {
                    deadlineStatus = "Completed";
                } else if (daysLeft < 0) {
                    deadlineStatus = "Overdue";
                } else if (daysLeft <= 2) {
                    deadlineStatus = "Due Soon";
                } else {
                    deadlineStatus = "On Track";
                }
            }

            const category =
                task.category || "general";

            const confidence =
                task.confidence != null
                    ? Math.round(task.confidence * 100) + "%"
                    : "Not available";

            let action = "";

            if (task.status === "COMPLETED") {

                action =
                    '<div style="margin-top:10px;">✅ Task Completed</div>';

            } else {

                action = `
                    <button onclick="completeTask('${task.task_id}')">
                        ✓ Complete Task
                    </button>
                `;

            }

            const link = task.link
                ? `
                    <a
                        class="source-link"
                        href="${task.link}"
                        target="_blank"
                        rel="noopener noreferrer">
                        🔗 Open Source
                    </a>
                  `
                : "";

            card.innerHTML = `

                <div class="task-title">
                    ${task.title}
                </div>

                <div class="task-id">
                    Task ID: ${task.task_id}
                </div>

                <div class="detail">
                    <strong>Description:</strong>
                    ${task.description || "Not specified"}
                </div>

                <div class="detail">
                    <strong>Deadline:</strong>
                    ${deadline}
                </div>

                <div class="detail">
                    <strong>Priority:</strong>
                    ${task.priority}
                </div>

                <div class="detail">
                    <strong>Category:</strong>
                    ${category}
                </div>

                <div class="detail">
                    <strong>AI Confidence:</strong>
                    ${confidence}
                </div>

                <div class="detail">
                    <strong>Status:</strong>
                    ${task.status}
                </div>

                <div class="detail">
                    <strong>Deadline Status:</strong>
                    ${deadlineStatus}
                </div>

                <div class="detail">
                    <strong>Dependency:</strong>
                    ${dependency}
                </div>

                ${action}

                ${link}

            `;

            container.appendChild(card);

        });

    } catch (error) {

        console.error(error);

        container.innerHTML =
            '<div class="error">Unable to load tasks. Please check whether the backend is running.</div>';

    }
}


function updateSummary(tasks) {

    const total = tasks.length;

    const completed =
        tasks.filter(
            task => task.status === "COMPLETED"
        ).length;

    const pending =
        tasks.filter(
            task => task.status !== "COMPLETED"
        ).length;

    const high =
        tasks.filter(
            task =>
                task.priority &&
                task.priority.toLowerCase() === "high" &&
                task.status !== "COMPLETED"
        ).length;

    const today = new Date();

    const upcoming =
        tasks.filter(
            task =>
                task.deadline &&
                task.status !== "COMPLETED" &&
                new Date(task.deadline + "T23:59:59") >= today
        ).length;

    document.getElementById("totalTasks").textContent = total;

    document.getElementById("completedTasks").textContent =
        completed;

    document.getElementById("pendingTasks").textContent =
        pending;

    document.getElementById("highTasks").textContent =
        high;

    document.getElementById("upcomingTasks").textContent =
        upcoming;
}


async function completeTask(taskId) {

    try {

        const response = await fetch(
            `/tasks/${taskId}/complete`,
            {
                method: "PATCH"
            }
        );

        if (!response.ok) {

            const error = await response.json();

            alert(
                error.detail ||
                "Unable to complete task."
            );

            return;

        }

        await loadTasks();

    } catch (error) {

        console.error(error);

        alert(
            "Could not connect to ContextFlow backend."
        );

    }
}


loadTasks();

</script>

</body>
</html>
