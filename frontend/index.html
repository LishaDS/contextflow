<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ContextFlow Dashboard</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 30px;
}

.container {
    max-width: 1100px;
    margin: auto;
}

h1 {
    margin-bottom: 5px;
}

.subtitle {
    color: #666;
    margin-bottom: 25px;
}

.summary {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 15px;
    margin-bottom: 30px;
}

.summary-card {
    background: white;
    padding: 18px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.summary-card .label {
    color: #666;
    font-size: 14px;
}

.summary-card .number {
    font-size: 28px;
    font-weight: bold;
    margin-top: 8px;
}

.task-card {
    background: white;
    padding: 20px;
    margin-bottom: 15px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.task-title {
    font-size: 19px;
    font-weight: bold;
    margin-bottom: 8px;
}

.task-id {
    font-size: 12px;
    color: #777;
    margin-bottom: 12px;
}

.detail {
    margin: 7px 0;
}

.priority {
    font-weight: bold;
}

.priority-critical {
    color: #b00020;
}

.priority-high {
    color: #d35400;
}

.priority-medium {
    color: #9a7d00;
}

.priority-low {
    color: #2e7d32;
}

button {
    padding: 9px 14px;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    margin-top: 10px;
    background: #222;
    color: white;
}

button:hover {
    opacity: 0.9;
}

.status-select {
    padding: 8px 10px;
    border-radius: 7px;
    border: 1px solid #ccc;
    background: white;
    margin-left: 8px;
    cursor: pointer;
}

.status-label {
    font-weight: bold;
}

.source-link {
    display: inline-block;
    margin-left: 8px;
    padding: 9px 14px;
    background: #e9eef5;
    color: #222;
    text-decoration: none;
    border-radius: 7px;
}

.empty {
    color: #777;
}

.error {
    color: #b00020;
    font-weight: bold;
}

.priority-reason {
    background: #f7f8fa;
    padding: 8px 10px;
    border-radius: 6px;
    margin-top: 5px;
}

.status-message {
    margin-top: 8px;
    font-size: 13px;
    color: #666;
}

@media (max-width: 800px) {
    .summary {
        grid-template-columns: repeat(2, 1fr);
    }
}
</style>
</head>

<body>

<div class="container">

<h1>ContextFlow</h1>

<div class="subtitle">
AI-powered Context-to-Workflow Automation
</div>

<div class="summary">

    <div class="summary-card">
        <div class="label">Total Tasks</div>
        <div class="number" id="totalTasks">0</div>
    </div>

    <div class="summary-card">
        <div class="label">Completed</div>
        <div class="number" id="completedTasks">0</div>
    </div>

    <div class="summary-card">
        <div class="label">Pending</div>
        <div class="number" id="pendingTasks">0</div>
    </div>

    <div class="summary-card">
        <div class="label">High Priority</div>
        <div class="number" id="highTasks">0</div>
    </div>

    <div class="summary-card">
        <div class="label">Upcoming Deadlines</div>
        <div class="number" id="upcomingTasks">0</div>
    </div>

</div>

<div style="margin-bottom:20px;">

    <button onclick="filterTasks('ALL')">
        All
    </button>

    <button onclick="filterTasks('PENDING')" style="margin-left:8px;">
        Pending
    </button>

    <button onclick="filterTasks('COMPLETED')" style="margin-left:8px;">
        Completed
    </button>

    <button onclick="filterTasks('HIGH')" style="margin-left:8px;">
        High Priority
    </button>

    <input
        id="taskSearch"
        type="text"
        placeholder="Search tasks..."
        oninput="searchTasks()"
        style="margin-left:8px; padding:8px;"
    >

</div>

<h2>Tasks</h2>

<div id="tasks">
Loading tasks...
</div>

</div>

<script>

let allTasks = [];


function getEffectivePriority(task) {

    return (
        task.effective_priority ||
        task.priority ||
        "medium"
    ).toLowerCase();

}


function searchTasks() {

    const query =
        document
            .getElementById("taskSearch")
            .value
            .toLowerCase()
            .trim();

    const filtered = allTasks.filter(task =>

        (task.title || "")
            .toLowerCase()
            .includes(query)

        ||

        (task.category || "")
            .toLowerCase()
            .includes(query)

        ||

        (task.priority || "")
            .toLowerCase()
            .includes(query)

        ||

        (task.effective_priority || "")
            .toLowerCase()
            .includes(query)

        ||

        (task.status || "")
            .toLowerCase()
            .includes(query)

    );

    renderTasks(filtered);
}


function filterTasks(filter) {

    let filtered = allTasks;

    if (filter === "PENDING") {

        filtered = allTasks.filter(
            task => task.status !== "COMPLETED"
        );

    }

    if (filter === "COMPLETED") {

        filtered = allTasks.filter(
            task => task.status === "COMPLETED"
        );

    }

    if (filter === "HIGH") {

        filtered = allTasks.filter(task => {

            const priority =
                getEffectivePriority(task);

            return (
                priority === "high" ||
                priority === "critical"
            );

        });

    }

    renderTasks(filtered);
}


function getPriorityClass(priority) {

    if (priority === "critical") {
        return "priority-critical";
    }

    if (priority === "high") {
        return "priority-high";
    }

    if (priority === "medium") {
        return "priority-medium";
    }

    return "priority-low";
}


function renderTasks(tasks) {

    const container =
        document.getElementById("tasks");

    container.innerHTML = "";

    if (!tasks || tasks.length === 0) {

        container.innerHTML =
            '<div class="empty">No tasks found.</div>';

        return;
    }

    tasks.forEach(task => {

        const card =
            document.createElement("div");

        card.className = "task-card";

        const priority =
            getEffectivePriority(task);

        const priorityClass =
            getPriorityClass(priority);

        const currentStatus =
            task.status || "READY";

        card.innerHTML = `

            <div class="task-title">
                ${task.title}
            </div>

            <div class="task-id">
                Task ID: ${task.task_id}
            </div>

            <div class="detail">
                <strong>Description:</strong>
                ${task.description || "Not specified"}
            </div>

            <div class="detail">
                <strong>Deadline:</strong>
                ${task.deadline || "Not specified"}
            </div>

            <div class="detail priority ${priorityClass}">
                <strong>Effective Priority:</strong>
                ${priority.toUpperCase()}
            </div>

            <div class="detail priority-reason">
                <strong>Why this priority?</strong>
                ${task.priority_reason ||
                  "Priority determined from task urgency and available task information."}
            </div>

            <div class="detail">
                <strong>Category:</strong>
                ${task.category || "general"}
            </div>

            <div class="detail">
                <strong>AI Confidence:</strong>
                ${
                    task.confidence != null
                    ? Math.round(task.confidence * 100) + "%"
                    : "Not available"
                }
            </div>

            <div class="detail">
                <span class="status-label">Status:</span>

                <select
                    class="status-select"
                    onchange="updateTaskStatus(
                        '${task.task_id}',
                        this.value
                    )"
                >

                    <option value="READY"
                        ${currentStatus === "READY" ? "selected" : ""}>
                        READY
                    </option>

                    <option value="IN PROGRESS"
                        ${currentStatus === "IN PROGRESS" ? "selected" : ""}>
                        IN PROGRESS
                    </option>

                    <option value="BLOCKED"
                        ${currentStatus === "BLOCKED" ? "selected" : ""}>
                        BLOCKED
                    </option>

                    <option value="COMPLETED"
                        ${currentStatus === "COMPLETED" ? "selected" : ""}>
                        COMPLETED
                    </option>

                </select>
            </div>

            <div class="detail">
                <strong>Deadline Status:</strong>
                ${task.deadline_status || "No deadline"}
            </div>

            <div class="detail">
                <strong>Reminder:</strong>
                ${task.reminder_message || "No reminder"}
            </div>

            <div class="detail">
                <strong>Dependency:</strong>
                ${task.depends_on || "None"}
            </div>

        `;

        if (task.status === "COMPLETED") {

            card.innerHTML +=
                '<div style="margin-top:10px;">✅ Task Completed</div>';

        } else {

            card.innerHTML += `

                <button
                    onclick="completeTask('${task.task_id}')">
                    ✓ Complete Task
                </button>

            `;

        }

        if (task.link) {

            card.innerHTML += `

                <a
                    class="source-link"
                    href="${task.link}"
                    target="_blank"
                    rel="noopener noreferrer">

                    🔗 Open Source

                </a>

            `;

        }

        container.appendChild(card);

    });

}


async function updateTaskStatus(taskId, newStatus) {

    try {

        const response =
            await fetch(
                `/tasks/${taskId}/status`,
                {
                    method: "PATCH",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        status: newStatus
                    })
                }
            );

        if (!response.ok) {

            const error =
                await response.json();

            alert(
                error.detail ||
                "Unable to update task status."
            );

            await loadTasks();

            return;
        }

        await loadTasks();

    } catch (error) {

        console.error(error);

        alert(
            "Could not connect to ContextFlow backend."
        );

        await loadTasks();

    }

}


async function loadTasks() {

    const container =
        document.getElementById("tasks");

    try {

        const response =
            await fetch("/tasks");

        if (!response.ok) {

            throw new Error(
                "Failed to load tasks"
            );

        }

        const tasks =
            await response.json();

        allTasks = tasks;

        updateSummary(tasks);

        renderTasks(tasks);

    } catch (error) {

        console.error(error);

        container.innerHTML =
            '<div class="error">Unable to load tasks. Please check whether the backend is running.</div>';

    }

}


function updateSummary(tasks) {

    const total =
        tasks.length;

    const completed =
        tasks.filter(
            task =>
                task.status === "COMPLETED"
        ).length;

    const pending =
        tasks.filter(
            task =>
                task.status !== "COMPLETED"
        ).length;

    const high =
        tasks.filter(task => {

            const priority =
                getEffectivePriority(task);

            return (
                (
                    priority === "high" ||
                    priority === "critical"
                )
                &&
                task.status !== "COMPLETED"
            );

        }).length;

    const today =
        new Date();

    const upcoming =
        tasks.filter(task =>

            task.deadline

            &&

            task.status !== "COMPLETED"

            &&

            new Date(
                task.deadline + "T23:59:59"
            ) >= today

        ).length;


    document.getElementById(
        "totalTasks"
    ).textContent = total;


    document.getElementById(
        "completedTasks"
    ).textContent = completed;


    document.getElementById(
        "pendingTasks"
    ).textContent = pending;


    document.getElementById(
        "highTasks"
    ).textContent = high;


    document.getElementById(
        "upcomingTasks"
    ).textContent = upcoming;

}


async function completeTask(taskId) {

    try {

        const response =
            await fetch(
                `/tasks/${taskId}/complete`,
                {
                    method: "PATCH"
                }
            );

        if (!response.ok) {

            const error =
                await response.json();

            alert(
                error.detail ||
                "Unable to complete task."
            );

            return;

        }

        await loadTasks();

    } catch (error) {

        console.error(error);

        alert(
            "Could not connect to ContextFlow backend."
        );

    }

}


loadTasks();

</script>

</body>
</html>
