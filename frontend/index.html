<!DOCTYPE html>
<html>
<head>
    <title>ContextFlow</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f5f7fa; }
        h1 { margin-bottom: 5px; }
        .subtitle { color: #666; margin-bottom: 30px; }
        form, .task {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        input, select, button { padding: 10px; margin: 5px; }
        button { cursor: pointer; }
        .completed { color: green; font-weight: bold; }
    </style>
</head>
<body>

<h1>ContextFlow</h1>
<div class="subtitle">Intelligent Context-to-Workflow Automation</div>

<form id="taskForm">
    <input id="title" placeholder="Task title" required>
    <input id="deadline" type="date">
    <select id="priority">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
    </select>
    <input id="source" placeholder="Source">
    <button type="submit">Create Task</button>
</form>

<div id="tasks"></div>

<script>
async function loadTasks() {
    const response = await fetch("/tasks");
    const data = await response.json();
    const container = document.getElementById("tasks");
    container.innerHTML = "";

    data.tasks.forEach(task => {
        const item = document.createElement("div");
        item.className = "task";

        item.innerHTML = `
            <h2>${task.title}</h2>
            <p>Deadline: ${task.deadline || "Not specified"}</p>
            <p>Priority: ${task.priority}</p>
            <p class="${task.status === "COMPLETED" ? "completed" : ""}">
                Status: ${task.status}
            </p>
            <p>Source: ${task.source || "Unknown"}</p>
        `;

        container.appendChild(item);
    });
}

document.getElementById("taskForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    await fetch("/tasks", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            task_id: "",
            title: document.getElementById("title").value,
            description: "Created from ContextFlow dashboard",
            deadline: document.getElementById("deadline").value || null,
            priority: document.getElementById("priority").value,
            status: "READY",
            source: document.getElementById("source").value || "Manual input",
            link: null
        })
    });

    document.getElementById("taskForm").reset();
    loadTasks();
});

loadTasks();
</script>

</body>
</html>
