<!DOCTYPE html>
<html>
<head>
    <title>ContextFlow</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f5f7fa;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        form,
        .task {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        input,
        select,
        button {
            padding: 10px;
            margin: 5px;
        }

        button {
            cursor: pointer;
        }

        .completed {
            color: green;
            font-weight: bold;
        }

        .celebration {
            background: #e8f5e9;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        .source-link {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 12px;
            background: #eef2ff;
            border-radius: 6px;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <h1>ContextFlow</h1>

    <div class="subtitle">
        Intelligent Context-to-Workflow Automation
    </div>

    <form id="taskForm">

        <input
            id="title"
            type="text"
            placeholder="Task title"
            required
        >

        <input
            id="deadline"
            type="date"
        >

        <select id="priority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
        </select>

        <input
            id="source"
            type="text"
            placeholder="Source"
        >

        <input
            id="link"
            type="url"
            placeholder="Source link"
        >

        <button type="submit">
            Create Task
        </button>

    </form>

    <div id="celebration"></div>

    <div id="tasks"></div>


    <script>

        function timeRemaining(deadline) {

            if (!deadline) {
                return "No deadline";
            }

            const now = new Date();

            const due = new Date(
                deadline + "T23:59:59"
            );

            const difference =
                due - now;

            const hours = Math.ceil(
                difference /
                (1000 * 60 * 60)
            );

            if (hours < 0) {
                return "Overdue";
            }

            if (hours < 24) {
                return hours +
                    " hours remaining";
            }

            return Math.ceil(
                hours / 24
            ) + " days remaining";
        }


        async function loadTasks() {

            const response =
                await fetch("/tasks");

            const data =
                await response.json();

            const taskContainer =
                document.getElementById("tasks");

            const celebration =
                document.getElementById(
                    "celebration"
                );

            taskContainer.innerHTML = "";


            const allCompleted =
                data.tasks.length > 0 &&
                data.tasks.every(
                    task =>
                        task.status ===
                        "COMPLETED"
                );


            if (allCompleted) {

                celebration.className =
                    "celebration";

                celebration.innerHTML = `
                    <h2>
                        🎉 All tasks completed!
                    </h2>

                    <p>
                        Great work! Your active
                        workflow is complete.
                    </p>
                `;

            } else {

                celebration.className = "";

                celebration.innerHTML = "";
            }


            data.tasks.forEach(task => {

                const item =
                    document.createElement(
                        "div"
                    );

                item.className = "task";


                let completeButton = "";

                if (
                    task.status !==
                    "COMPLETED"
                ) {

                    completeButton = `
                        <button
                            onclick="completeTask('${task.task_id}')"
                        >
                            Mark Complete
                        </button>
                    `;
                }


                let sourceLink = "";

                if (task.link) {

                    sourceLink = `
                        <br>

                        <a
                            class="source-link"
                            href="${task.link}"
                            target="_blank"
                        >
                            🔗 Open Source
                        </a>
                    `;

                }


                item.innerHTML = `

                    <h2>
                        ${task.title}
                    </h2>

                    <p>
                        <strong>
                            Deadline:
                        </strong>

                        ${
                            task.deadline ||
                            "Not specified"
                        }
                    </p>

                    <p>
                        <strong>
                            ${
                                timeRemaining(
                                    task.deadline
                                )
                            }
                        </strong>
                    </p>

                    <p>
                        <strong>
                            Priority:
                        </strong>

                        ${task.priority}
                    </p>

                    <p
                        class="${
                            task.status ===
                            "COMPLETED"
                            ? "completed"
                            : ""
                        }"
                    >
                        <strong>
                            Status:
                        </strong>

                        ${task.status}
                    </p>

                    <p>
                        <strong>
                            Source:
                        </strong>

                        ${
                            task.source ||
                            "Unknown"
                        }

                        ${sourceLink}

                    </p>

                    ${completeButton}

                `;

                taskContainer.appendChild(
                    item
                );

            });

        }


        async function completeTask(taskId) {

            await fetch(
                `/tasks/${taskId}/complete`,
                {
                    method: "PATCH"
                }
            );

            await loadTasks();
        }


        document
            .getElementById("taskForm")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();


                    const title =
                        document
                        .getElementById("title")
                        .value;

                    const deadline =
                        document
                        .getElementById("deadline")
                        .value;

                    const priority =
                        document
                        .getElementById("priority")
                        .value;

                    const source =
                        document
                        .getElementById("source")
                        .value;

                    const link =
                        document
                        .getElementById("link")
                        .value;


                    await fetch(
                        "/tasks",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({

                                    task_id: "",

                                    title:
                                        title,

                                    description:
                                        "Created from ContextFlow dashboard",

                                    deadline:
                                        deadline ||
                                        null,

                                    priority:
                                        priority,

                                    status:
                                        "READY",

                                    source:
                                        source ||
                                        "Manual input",

                                    link:
                                        link ||
                                        null
                                })
                        }
                    );


                    document
                        .getElementById(
                            "taskForm"
                        )
                        .reset();


                    await loadTasks();

                }
            );


        loadTasks();

    </script>

</body>
</html>
