/* =========================================================
   SERVICENOW NAVIGATION
   ========================================================= */

function openServiceNowSection(
    section
) {

    window.location.assign(
        `${window.location.origin}/mock/servicenow?section=${encodeURIComponent(section)}`
    );

}


function openServiceNowTicket(
    ticketId,
    section = "work"
) {

    window.location.assign(
        `${window.location.origin}/mock/servicenow?ticket=${encodeURIComponent(ticketId)}&section=${encodeURIComponent(section)}`
    );

}


function openServiceNowForm(
    ticketId
) {

    window.location.assign(
        `${window.location.origin}/mock/servicenow-form?ticket=${encodeURIComponent(ticketId)}`
    );

}


/* =========================================================
   ACTION PAGE
   ========================================================= */

function renderAction(
    page
) {

    return `

        <div
            class="
                topbar
                action-topbar
            "
        >

            ${page.brand}

            <span>
                Enterprise Demo Environment
            </span>

        </div>


        <div
            class="
                action-page
            "
        >

            <div
                class="
                    action-card
                "
            >

                <div
                    class="
                        action-card-header
                    "
                >

                    <h1>
                        ${page.title}
                    </h1>

                    <p>
                        Complete the required action
                    </p>

                </div>


                <div
                    class="
                        action-card-body
                    "
                >

                    ${page.body}


                    <button
                        class="
                            action-button
                            navy-button
                        "
                        onclick="
                            completeAction()
                        "
                    >
                        ${page.button}
                    </button>


                    <div
                        id="success"
                        class="success"
                    >

                        ✓ Action completed successfully.

                    </div>

                </div>

            </div>

        </div>

    `;

}


/* =========================================================
   ACTION COMPLETION
   ========================================================= */

function completeAction() {

    const success =
        document.getElementById(
            "success"
        );


    if (success) {

        success.style.display =
            "block";

    }

}


/* =========================================================
   ROUTING
   ========================================================= */

const pathParts =
    window.location.pathname
        .split("/")
        .filter(Boolean);


const site =
    pathParts[
        pathParts.length - 1
    ];


/* =========================================================
   OUTLOOK ROUTE
   ========================================================= */

if (
    site === "outlook"
) {

    const params =
        new URLSearchParams(
            window.location.search
        );


    const emailId =
        params.get("email") ||
        "security";


    const section =
        params.get("section") ||
        "inbox";


    document
        .getElementById("app")
        .innerHTML =
            renderOutlook(
                emailId,
                section
            );

}


/* =========================================================
   TEAMS ROUTE
   ========================================================= */

else if (
    site === "teams"
) {

    const params =
        new URLSearchParams(
            window.location.search
        );


    const messageId =
        params.get("message") ||
        "cloud";


    const section =
        params.get("section") ||
        "chat";


    document
        .getElementById("app")
        .innerHTML =
            renderTeams(
                messageId,
                section
            );

}


/* =========================================================
   SERVICENOW ROUTE
   ========================================================= */

else if (
    site === "servicenow"
) {

    const params =
        new URLSearchParams(
            window.location.search
        );


    const ticketId =
        params.get("ticket") ||
        null;


    const section =
        params.get("section") ||
        "work";


    document
        .getElementById("app")
        .innerHTML =
            renderServiceNow(
                ticketId,
                section
            );

}


/* =========================================================
   ACTION ROUTES
   ========================================================= */

else if (
    actionPages[site]
) {

    document
        .getElementById("app")
        .innerHTML =
            renderAction(
                actionPages[site]
            );

}


/* =========================================================
   OLD OUTLOOK ROUTES
   ========================================================= */

else if (
    site === "outlook-security" ||
    site === "outlook-epfo"
) {

    const emailId =
        site === "outlook-epfo"
            ? "epfo"
            : "security";


    document
        .getElementById("app")
        .innerHTML =
            renderOutlook(
                emailId,
                "inbox"
            );

}


/* =========================================================
   OLD TEAMS ROUTE
   ========================================================= */

else if (
    site === "teams-assessment"
) {

    document
        .getElementById("app")
        .innerHTML =
            renderTeams(
                "cloud",
                "chat"
            );

}


/* =========================================================
   PAGE NOT FOUND
   ========================================================= */

else {

    document
        .getElementById("app")
        .innerHTML = `

            <div
                class="
                    action-page
                "
            >

                <div
                    class="
                        action-card
                    "
                >

                    <div
                        class="
                            action-card-body
                        "
                    >

                        <h1>
                            Page not found
                        </h1>

                        <p>
                            The requested enterprise
                            demo page does not exist.
                        </p>

                    </div>

                </div>

            </div>

        `;

}

</script>
